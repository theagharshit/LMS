name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lms_db
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lms -d lms_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://lms:lms_ci_password@localhost:5432/lms_db?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run prisma:deploy
      - run: npm run prisma:status
      - run: npm run seed
      - run: npm run build
      - run: npm test
